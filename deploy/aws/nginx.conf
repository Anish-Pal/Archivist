# Reverse proxy for Archivist. Install to /etc/nginx/sites-available/archivist
# and symlink into sites-enabled. Replace REPLACE_WITH_DOMAIN first.
#
# certbot rewrites this file when it issues a certificate, adding the TLS
# listener and the port 80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;

    # Document uploads exceed nginx's 1 MB default, which would fail as a 413
    # before the request ever reached the app.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:7860;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Uvicorn runs with --proxy-headers; this is what tells it the client
        # is on HTTPS, so redirects and the Secure cookie behave correctly.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Retrieval, reranking and the LLM call can take well over nginx's
        # 60 second default on a cold or heavily loaded instance.
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;

        proxy_buffering off;
    }
}
